name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install JSHint
        run: npm install jshint --global
      - name: Run Linter
        run: |
          find ./giftlink-backend ./sentiment -name "*.js" -not -path "*/node_modules/*" -not -name "*.test.js" -exec jshint {} +
          echo "Linted all the js files successfully"
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: sentiment
      - run: npm install
        working-directory: giftlink-backend
      - run: npm test
        working-directory: giftlink-backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: giftlink-frontend
      - run: npm run build
        working-directory: giftlink-frontend
        env:
          CI: false
